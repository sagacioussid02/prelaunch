version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 (the native compiler) drops the JS API that next build
      # uses to load next.config.ts, so the build fails. Revisit when Next
      # supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
