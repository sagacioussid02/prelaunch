# Monitor runs every 6 hours, triggered from GitHub Actions.
#
# Vercel's free Hobby plan only allows daily crons, so vercel.json keeps a
# daily run of /api/cron/run-monitors as a fallback and this workflow calls
# the same endpoint every 6 hours (hourly was more scans than wanted). The endpoint only starts monitors that are
# due, so the two never double-run a monitor.
#
# Needs, in the repository's Settings > Secrets and variables > Actions:
#   - secret   CRON_SECRET    same value as CRON_SECRET on the Vercel project
#   - variable PRELAUNCH_URL  the production URL, e.g. https://prelaunch.example.com
#                             (a secret of that name works too). GitHub only:
#                             the app never reads it, so Vercel doesn't need it.
# Until both are set, each run logs a warning and does nothing.
#
# PRELAUNCH_URL must be the final https:// address. An http:// or scheme-less
# value is upgraded to https://, so the bearer token never travels unencrypted
# and Vercel's http->https 308 can't swallow the run (issue #52). Redirects are
# never followed, since following one would send CRON_SECRET to whatever host
# it names; a 3xx fails the run and names the host it points to.
name: Run monitors

on:
  schedule:
    - cron: "17 */6 * * *" # 00:17, 06:17, 12:17, 18:17 UTC; off the top of the hour, when GitHub's scheduler is busiest
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: run-monitors
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/cron/run-monitors
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRELAUNCH_URL: ${{ vars.PRELAUNCH_URL || secrets.PRELAUNCH_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$PRELAUNCH_URL" ]; then
            [ -z "$CRON_SECRET" ] && echo "::warning::CRON_SECRET secret is not set; skipping."
            [ -z "$PRELAUNCH_URL" ] && echo "::warning::PRELAUNCH_URL (repo variable or secret) is not set; skipping."
            exit 0
          fi
          base="${PRELAUNCH_URL%/}"
          case "$base" in
            https://*|http://localhost|http://localhost:*|http://127.0.0.1|http://127.0.0.1:*) ;;
            http://*)
              echo "::warning::PRELAUNCH_URL starts with http://; calling https:// instead. Set PRELAUNCH_URL to its https:// address."
              base="https://${base#http://}" ;;
            *://*)
              echo "::error::PRELAUNCH_URL must be an https:// address."
              exit 1 ;;
            *)
              echo "::warning::PRELAUNCH_URL has no scheme; calling https://. Set PRELAUNCH_URL to its https:// address."
              base="https://$base" ;;
          esac
          url="$base/api/cron/run-monitors"
          out=$(curl -sS -o response.json -w '%{http_code} %{redirect_url}' --max-time 60 \
            --retry 2 --retry-delay 10 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" "$url")
          status="${out%% *}"
          redirect="${out#* }"
          echo "HTTP $status"
          case "$status" in
            3??)
              # Name only the target's scheme and host; never follow it.
              target=$(printf '%s' "$redirect" | sed -E 's#^([a-zA-Z]+://[^/?#]*).*#\1#')
              echo "::error::PRELAUNCH_URL redirects (HTTP $status) to ${target:-an unknown address}; set PRELAUNCH_URL to that address."
              exit 1 ;;
          esac
          head -c 4000 response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::run-monitors returned HTTP $status"
            exit 1
          fi
